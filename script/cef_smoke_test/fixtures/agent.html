<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Smoke Agent</title></head>
<body>
<h1>Agent actions</h1>
<form id="form" onsubmit="return false">
  <input id="name" aria-label="Name" autocomplete="off">
  <button id="go" type="button">Go</button>
  <label><input id="keep" type="checkbox"> Keep</label>
</form>
<div style="height: 3000px"></div>
<button id="far" type="button">Far</button>
<script>
  // What the agent CLI's actions did, read back by the smoke test.
  window.smoke = {keys: []};
  const name = document.getElementById("name");
  const activation = () => !!(navigator.userActivation && navigator.userActivation.isActive);
  name.addEventListener("keydown", (e) => {
    window.smoke.keys.push(e.key);
    if (e.key === "Enter") window.smoke.enter = {trusted: e.isTrusted, value: name.value};
  });
  document.getElementById("go").addEventListener("click", (e) => {
    window.smoke.go = {trusted: e.isTrusted, value: name.value, activation: activation()};
  });
  document.getElementById("keep").addEventListener("change", (e) => {
    window.smoke.keep = {trusted: e.isTrusted, checked: e.target.checked};
  });
  document.getElementById("far").addEventListener("click", (e) => {
    window.smoke.far = {trusted: e.isTrusted, scrolled: Math.round(scrollY)};
  });
</script>
</body>
</html>
