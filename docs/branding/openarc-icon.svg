<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">OpenArc app icon</title>
  <desc id="desc">A blue and violet A inside an open turquoise orbit on a pale rounded square.</desc>
  <defs>
    <linearGradient id="tile" x1="92" y1="30" x2="430" y2="492" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5FFFD"/>
      <stop offset="0.52" stop-color="#F5F7FF"/>
      <stop offset="1" stop-color="#E9E5FC"/>
    </linearGradient>
    <linearGradient id="edge" x1="256" y1="24" x2="256" y2="488" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DAD8EC"/>
