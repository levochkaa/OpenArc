[package]
name = "openarc-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "OpenArc's platform-neutral browser logic, shared by every app through UniFFI."

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
icu_normalizer = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
idna = "1.1.0"
openarc-sync-protocol = { path = "../openarc-sync-protocol" }
psl = "2.1.265"
thiserror = "2.0.17"
uniffi = { workspace = true, features = ["macro-scaffolding"] }

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
flate2 = "1.1.5"
