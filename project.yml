name: TheBrowser
options:
  bundleIdPrefix: com.levochkaa
  minimumXcodeGenVersion: 2.45.3
  xcodeVersion: 26.4
  projectFormat: xcode16_3
  indentWidth: 4
  tabWidth: 4
  deploymentTarget:
    macOS: 26.0
  groupSortPosition: top
  generateEmptyDirectories: true
  defaultSourceDirectoryType: syncedFolder
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    ARCHS: arm64
    ENABLE_DEBUG_DYLIB: NO
    CLANG_CXX_LANGUAGE_STANDARD: gnu++17
    SWIFT_VERSION: "5.10"
    GCC_ENABLE_CPP_EXCEPTIONS: NO
    GCC_ENABLE_CPP_RTTI: NO
    GCC_PREPROCESSOR_DEFINITIONS:
      - $(inherited)
      - __STDC_CONSTANT_MACROS
      - __STDC_FORMAT_MACROS
    HEADER_SEARCH_PATHS:
      - $(inherited)
      - $(SRCROOT)/Sources
      - $(SRCROOT)/ThirdParty/cef/current
    OTHER_LDFLAGS:
      - $(inherited)
      - $(SRCROOT)/.build/cef-wrapper/libcef_dll_wrapper/$(CONFIGURATION)/libcef_dll_wrapper.a
      - -lpthread
      - -framework
      - AppKit
      - -framework
      - Cocoa
      - -framework
      - IOSurface
      - -framework
      - UserNotifications
packages:
  DomainParser:
    url: https://github.com/Dashlane/SwiftDomainParser.git
    exactVersion: 1.1.0
targets:
  TheBrowserHelper:
    type: application
    platform: macOS
    productName: "TheBrowser Helper"
    sources:
      - path: Sources/Helper
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levochkaa.TheBrowser.helper
        PRODUCT_NAME: "TheBrowser Helper"
        INFOPLIST_FILE: Support/TheBrowserHelper-Info.plist
        SWIFT_EMIT_LOC_STRINGS: NO
  TheBrowser:
    type: application
    platform: macOS
    sources:
      - path: Sources/Browser
      - path: Sources/Shared
    dependencies:
      - target: TheBrowserHelper
      - package: DomainParser
    settings:
      base:
        PRODUCT_NAME: TheBrowser
        PRODUCT_BUNDLE_IDENTIFIER: com.levochkaa.TheBrowser
        INFOPLIST_FILE: Support/TheBrowser-Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Browser/TheBrowser-Bridging-Header.h
        SWIFT_EMIT_LOC_STRINGS: NO
    postBuildScripts:
      - name: Stage CEF Runtime
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/script/stage_cef_bundle.sh" \
            "$CONFIGURATION" \
            "$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME" \
            "$BUILT_PRODUCTS_DIR/TheBrowser Helper.app"
    scheme:
      gatherCoverageData: false
      testTargets:
        - TheBrowserTests
  TheBrowserTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/Browser/BrowserChromeModel.swift
      - path: Sources/Browser/BrowserCommandBarModel.swift
      - path: Sources/Browser/BrowserDefaultBrowserService.swift
      - path: Sources/Browser/BrowserExtensions.swift
      - path: Sources/Browser/BrowserFaviconCache.swift
      - path: Sources/Browser/BrowserNavigationResolver.swift
      - path: Sources/Browser/BrowserStrings.swift
      - path: Sources/Browser/BrowserSidebarTabDrag.swift
      - path: Sources/Browser/BrowserTabDriving.swift
      - path: Sources/Browser/BrowserTabSessionPersistence.swift
      - path: Sources/Browser/BrowserTooltipCoordinator.swift
      - path: Sources/Browser/BrowserURLDisplayFormatter.swift
      - path: Sources/Browser/BrowserUserPreferences.swift
      - path: Tests/TheBrowserTests
    settings:
      base:
        BUNDLE_LOADER: ""
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: TheBrowserTests
        TEST_HOST: ""
    dependencies:
      - package: DomainParser
