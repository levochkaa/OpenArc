name: TheBrowser
options:
  bundleIdPrefix: com.levochkaa
  minimumXcodeGenVersion: 2.45.3
  xcodeVersion: 26.5
  projectFormat: xcode16_3
  indentWidth: 4
  tabWidth: 4
  deploymentTarget:
    macOS: 26.0
  groupSortPosition: top
  generateEmptyDirectories: true
  defaultSourceDirectoryType: syncedFolder
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    ARCHS: arm64
    ENABLE_DEBUG_DYLIB: NO
    ENABLE_APP_INTENTS_METADATA_GENERATION: NO
    LM_FILTER_WARNINGS: YES
    LM_ENABLE_LINK_GENERATION: NO
    SWIFT_EMIT_CONST_VALUE_PROTOCOLS: ""
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    CLANG_WARN_COMMA: NO
    SWIFT_VERSION: "6.0"
    THEBROWSER_SENTRY_DSN: ""
    THEBROWSER_SENTRY_ENVIRONMENT: development
    THEBROWSER_SENTRY_TRACES_SAMPLE_RATE: "0.2"
    THEBROWSER_SENTRY_PROFILES_SAMPLE_RATE: "0.0"
    THEBROWSER_SENTRY_USAGE_ANALYTICS_ENABLED: YES
    THEBROWSER_SPARKLE_FEED_URL: https://updates.thebrowser.app/appcast.xml
    THEBROWSER_SPARKLE_PUBLIC_KEY: K2RmhxJLUxN8YeRS4I7Tz7cYrzkbcZB1axGePxRHflM=
    GCC_ENABLE_CPP_EXCEPTIONS: NO
    GCC_ENABLE_CPP_RTTI: NO
    GCC_PREPROCESSOR_DEFINITIONS:
      - $(inherited)
      - __STDC_CONSTANT_MACROS
      - __STDC_FORMAT_MACROS
    HEADER_SEARCH_PATHS:
      - $(inherited)
      - $(SRCROOT)/Sources
      - $(SRCROOT)/ThirdParty/cef/current
      - $(SRCROOT)/ThirdParty/cef/source/chromium/src
      - $(SRCROOT)/ThirdParty/cef/source/chromium/src/base/allocator/partition_allocator/src
      - $(SRCROOT)/ThirdParty/cef/source/chromium/src/out/$(CONFIGURATION)_GN_arm64/gen
      - $(SRCROOT)/ThirdParty/cef/source/chromium/src/out/$(CONFIGURATION)_GN_arm64/gen/base/allocator/partition_allocator/src
    OTHER_LDFLAGS:
      - $(inherited)
      - $(SRCROOT)/.build/cef-wrapper/libcef_dll_wrapper/$(CONFIGURATION)/libcef_dll_wrapper.a
      - -lpthread
      - -framework
      - AppKit
      - -framework
      - Cocoa
      - -framework
      - IOKit
      - -framework
      - IOSurface
      - -framework
      - UserNotifications
packages:
  DomainParser:
    url: https://github.com/Dashlane/SwiftDomainParser.git
    exactVersion: 1.1.0
  Gzip:
    url: https://github.com/1024jp/GzipSwift.git
    exactVersion: 7.0.0
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.10.0
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    exactVersion: 9.15.0
  Settings:
    url: https://github.com/sindresorhus/Settings.git
    exactVersion: 3.1.2
  SwiftOpenAPIGenerator:
    url: https://github.com/apple/swift-openapi-generator.git
    exactVersion: 1.12.2
  OpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime.git
    exactVersion: 1.12.0
  OpenAPIURLSession:
    url: https://github.com/apple/swift-openapi-urlsession.git
    exactVersion: 1.3.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
targets:
  TheBrowserHelper:
    type: application
    platform: macOS
    productName: "TheBrowser Helper"
    sources:
      - path: Sources/Helper
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levochkaa.TheBrowser.helper
        PRODUCT_NAME: "TheBrowser Helper"
        INFOPLIST_FILE: Support/TheBrowserHelper-Info.plist
        SWIFT_EMIT_LOC_STRINGS: NO
  TheBrowser:
    type: application
    platform: macOS
    sources:
      - path: Sources/Browser
      - path: Sources/Shared
      - path: Backend/openapi.yaml
        group: Sources/Browser/OpenAPI
    dependencies:
      - target: TheBrowserHelper
      - package: DomainParser
      - package: Gzip
      - package: GRDB
      - package: Sentry
      - package: Settings
      - package: OpenAPIRuntime
      - package: OpenAPIURLSession
      - package: ZIPFoundation
    buildToolPlugins:
      - plugin: OpenAPIGenerator
        package: SwiftOpenAPIGenerator
    settings:
      base:
        PRODUCT_NAME: TheBrowser
        PRODUCT_BUNDLE_IDENTIFIER: com.levochkaa.TheBrowser
        INFOPLIST_FILE: Support/TheBrowser-Info.plist
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Browser/TheBrowser-Bridging-Header.h
        SWIFT_EMIT_LOC_STRINGS: NO
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/.build/sparkle/Sparkle-2.9.2
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Sparkle
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Support/TheBrowser-Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Support/TheBrowser.entitlements
    postBuildScripts:
      - name: Stage Sparkle Framework
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/script/stage_sparkle_framework.sh" \
            "$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME"
      - name: Stage CEF Runtime
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/script/stage_cef_bundle.sh" \
            "${CEF_RUNTIME_CONFIGURATION:-Release}" \
            "$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME" \
            "$BUILT_PRODUCTS_DIR/TheBrowser Helper.app"
    scheme:
      gatherCoverageData: false
      testTargets:
        - TheBrowserTests
  TheBrowserTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/Browser/BrowserChromeModel.swift
      - path: Sources/Browser/BrowserChromeModelTypes.swift
      - path: Sources/Browser/BrowserBatterySaverPolicy.swift
      - path: Sources/Browser/BrowserBookmarks.swift
      - path: Sources/Browser/BrowserChromiumBookmarks.swift
      - path: Sources/Browser/BrowserChromiumHistory.swift
      - path: Sources/Browser/BrowserCommandBarModel.swift
      - path: Sources/Browser/BrowserDefaultBrowserService.swift
      - path: Sources/Browser/Downloads/BrowserDownloads.swift
      - path: Sources/Browser/BrowserExtensions.swift
      - path: Sources/Browser/BrowserExtensionSidePanel.swift
      - path: Sources/Browser/BrowserFaviconCache.swift
      - path: Sources/Browser/BrowserKeyboardShortcuts.swift
      - path: Sources/Browser/BrowserNavigationResolver.swift
      - path: Sources/Browser/BrowserProfiles.swift
      - path: Sources/Browser/BrowserStrings.swift
      - path: Sources/Browser/BrowserSidebarTabDrag.swift
      - path: Sources/Browser/Sidebar/BrowserSidebarSnapshot.swift
      - path: Sources/Browser/BrowserTabDriving.swift
      - path: Sources/Browser/BrowserTabSessionPersistence.swift
      - path: Sources/Browser/BrowserSQLiteSessionStore.swift
      - path: Sources/Browser/BrowserSyncModels.swift
      - path: Sources/Browser/BrowserRemoteSyncClient.swift
      - path: Sources/Browser/BrowserTooltipCoordinator.swift
      - path: Sources/Browser/BrowserURLDisplayFormatter.swift
      - path: Sources/Browser/BrowserUserPreferences.swift
      - path: Sources/Browser/BrowserTelemetry.swift
      - path: Sources/Browser/BrowserProfileBackup.swift
      - path: Sources/Browser/OpenAPI
      - path: Backend/openapi.yaml
        group: Sources/Browser/OpenAPI
      - path: Tests/TheBrowserTests
    buildToolPlugins:
      - plugin: OpenAPIGenerator
        package: SwiftOpenAPIGenerator
    settings:
      base:
        BUNDLE_LOADER: ""
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: TheBrowserTests
        TEST_HOST: ""
    dependencies:
      - package: DomainParser
      - package: Gzip
      - package: GRDB
      - package: Sentry
      - package: Settings
      - package: OpenAPIRuntime
      - package: OpenAPIURLSession
      - package: ZIPFoundation
