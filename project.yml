name: OpenArc
options:
  bundleIdPrefix: com.levochkaa
  minimumXcodeGenVersion: 2.45.3
  xcodeVersion: 27.1
  projectFormat: xcode16_3
  indentWidth: 4
  tabWidth: 4
  deploymentTarget:
    macOS: 26.0
    iOS: 26.0
  groupSortPosition: top
  generateEmptyDirectories: true
  defaultSourceDirectoryType: syncedFolder
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    ARCHS: arm64
    ENABLE_DEBUG_DYLIB: NO
    ENABLE_APP_INTENTS_METADATA_GENERATION: NO
    LM_FILTER_WARNINGS: YES
    LM_ENABLE_LINK_GENERATION: NO
    SWIFT_EMIT_CONST_VALUE_PROTOCOLS: ""
    SWIFT_VERSION: "6.0"
    OPENARC_SENTRY_DSN: ""
    OPENARC_SENTRY_ENVIRONMENT: development
    OPENARC_SENTRY_TRACES_SAMPLE_RATE: "0.2"
    OPENARC_SENTRY_PROFILES_SAMPLE_RATE: "0.0"
    OPENARC_SENTRY_USAGE_ANALYTICS_ENABLED: YES
    OPENARC_SPARKLE_FEED_URL: https://api.openarc.su/appcast.xml
    OPENARC_SPARKLE_PUBLIC_KEY: K2RmhxJLUxN8YeRS4I7Tz7cYrzkbcZB1axGePxRHflM=
targetTemplates:
  BrowserSyncCore:
    sources:
      - path: Sources/Browser/BrowserSessionDefaults.swift
      - path: Sources/Browser/BrowserSyncPlatformConfiguration.swift
      - path: Sources/Browser/BrowserAccountStore.swift
      - path: Sources/Browser/BrowserSyncModels.swift
      - path: Sources/Browser/BrowserSyncExpiryRecovery.swift
      - path: Sources/Browser/BrowserSyncExpiryModels.swift
      - path: Sources/Browser/BrowserSyncSemanticModels.swift
      - path: Sources/Browser/BrowserSyncFolderModels.swift
      - path: Sources/Browser/BrowserSyncSemanticProjection.swift
      - path: Sources/Browser/BrowserSyncFolderProjection.swift
      - path: Sources/Browser/BrowserSyncOutbox.swift
      - path: Sources/Browser/BrowserSyncQueuedMutation.swift
      - path: Sources/Browser/BrowserSyncOwner.swift
      - path: Sources/Browser/BrowserSyncMoveIntent.swift
      - path: Sources/Browser/BrowserTabSessionPersistence.swift
      - path: Sources/Browser/BrowserTabArchive.swift
      - path: Sources/Browser/BrowserSessionWrite.swift
      - path: Sources/Browser/BrowserSessionWriteBuffer.swift
      - path: Sources/Browser/BrowserSQLiteSessionStore.swift
      - path: Sources/Browser/BrowserRemoteSyncClient.swift
      - path: Sources/Browser/OpenAPI
      - path: Backend/openapi.yaml
        group: Sources/Browser/OpenAPI
    dependencies:
      - package: Gzip
      - package: GRDB
      - package: HTTPTypes
      - package: OpenAPIRuntime
      - package: OpenAPIURLSession
    buildToolPlugins:
      - plugin: OpenAPIGenerator
        package: SwiftOpenAPIGenerator
  ChromiumTarget:
    settings:
      base:
        CLANG_CXX_LANGUAGE_STANDARD: gnu++20
        CLANG_WARN_COMMA: NO
        GCC_ENABLE_CPP_EXCEPTIONS: NO
        GCC_ENABLE_CPP_RTTI: NO
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - __STDC_CONSTANT_MACROS
          - __STDC_FORMAT_MACROS
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Sources
          - $(SRCROOT)/ThirdParty/cef/current
          - $(SRCROOT)/ThirdParty/cef/source/chromium/src
          - $(SRCROOT)/ThirdParty/cef/source/chromium/src/base/allocator/partition_allocator/src
          - $(SRCROOT)/ThirdParty/cef/source/chromium/src/out/$(CONFIGURATION)_GN_arm64/gen
          - $(SRCROOT)/ThirdParty/cef/source/chromium/src/out/$(CONFIGURATION)_GN_arm64/gen/base/allocator/partition_allocator/src
        OTHER_LDFLAGS:
          - $(inherited)
          - $(SRCROOT)/.build/cef-wrapper/libcef_dll_wrapper/$(CONFIGURATION)/libcef_dll_wrapper.a
          - -lpthread
          - -framework
          - AppKit
          - -framework
          - Cocoa
          - -framework
          - IOKit
          - -framework
          - IOSurface
          - -framework
          - UserNotifications
packages:
  DomainParser:
    url: https://github.com/Dashlane/SwiftDomainParser.git
    exactVersion: 1.1.0
  Gzip:
    url: https://github.com/1024jp/GzipSwift.git
    exactVersion: 7.0.0
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.10.0
  HTTPTypes:
    url: https://github.com/apple/swift-http-types
    exactVersion: 1.5.1
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    exactVersion: 9.15.0
  Settings:
    url: https://github.com/sindresorhus/Settings.git
    exactVersion: 3.1.2
  SwiftOpenAPIGenerator:
    url: https://github.com/apple/swift-openapi-generator.git
    exactVersion: 1.12.2
  OpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime.git
    exactVersion: 1.12.0
  OpenAPIURLSession:
    url: https://github.com/apple/swift-openapi-urlsession.git
    exactVersion: 1.3.0
  ZIPFoundation:
    path: Packages/ZIPFoundation
targets:
  OpenArcWebAppLauncher:
    type: tool
    platform: macOS
    productName: "OpenArc Web App Launcher"
    sources:
      - path: Sources/WebAppLauncher
    settings:
      base:
        PRODUCT_NAME: "OpenArc Web App Launcher"
        PRODUCT_BUNDLE_IDENTIFIER: com.levochkaa.OpenArc.web-app-launcher
        OTHER_LDFLAGS:
          - -framework
          - Foundation
  OpenArcHelper:
    templates:
      - ChromiumTarget
    type: application
    platform: macOS
    productName: "OpenArc Helper"
    sources:
      - path: Sources/Helper
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levochkaa.OpenArc.helper
        PRODUCT_NAME: "OpenArc Helper"
        INFOPLIST_FILE: Support/OpenArcHelper-Info.plist
        SWIFT_EMIT_LOC_STRINGS: NO
  OpenArc:
    templates:
      - ChromiumTarget
    type: application
    platform: macOS
    sources:
      - path: Sources/Browser
      - path: Sources/Shared
      - path: Backend/openapi.yaml
        group: Sources/Browser/OpenAPI
    dependencies:
      - target: OpenArcHelper
      - target: OpenArcWebAppLauncher
      - package: DomainParser
      - package: Gzip
      - package: GRDB
      - package: Sentry
      - package: Settings
      - package: OpenAPIRuntime
      - package: OpenAPIURLSession
      - package: ZIPFoundation
    buildToolPlugins:
      - plugin: OpenAPIGenerator
        package: SwiftOpenAPIGenerator
    settings:
      base:
        PRODUCT_NAME: OpenArc
        PRODUCT_BUNDLE_IDENTIFIER: com.levochkaa.OpenArc
        INFOPLIST_FILE: Support/OpenArc-Info.plist
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Browser/OpenArc-Bridging-Header.h
        # OpenArc-Swift.h imports the bridging header by name. Compile caching would otherwise
        # write its prefix-mapped /^root path, which the Objective-C++ sources cannot open.
        OTHER_SWIFT_FLAGS:
          - $(inherited)
          - -Xfrontend
          - -bridging-header-directory-for-print
          - -Xfrontend
          - '""'
        SWIFT_EMIT_LOC_STRINGS: NO
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/.build/sparkle/Sparkle-2.9.2
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Sparkle
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Support/OpenArc-Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Support/OpenArc.entitlements
          GCC_PREPROCESSOR_DEFINITIONS:
            - $(inherited)
            - __STDC_CONSTANT_MACROS
            - __STDC_FORMAT_MACROS
            - NDEBUG
    postBuildScripts:
      - name: Stage Web App Launcher
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          ditto \
            "$BUILT_PRODUCTS_DIR/OpenArc Web App Launcher" \
            "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/OpenArc Web App Launcher"
      - name: Stage Sparkle Framework
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/script/stage_sparkle_framework.sh" \
            "$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME"
      - name: Stage CEF Runtime
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        # The script signs the app, so it must run after Xcode writes Info.plist.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          "$SRCROOT/script/stage_cef_bundle.sh" \
            "${CEF_RUNTIME_CONFIGURATION:-Release}" \
            "$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME" \
            "$BUILT_PRODUCTS_DIR/OpenArc Helper.app"
    scheme:
      gatherCoverageData: false
      testTargets:
        - OpenArcTests
  OpenArcTests:
    templates:
      - ChromiumTarget
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/Browser
        includes:
          - Browser*.swift
          - Downloads/*.swift
          - NativeUI/*.swift
          - Chrome/BrowserChromeColors.swift
          - Chrome/BrowserChromeLayout.swift
          - BrowserWindowGeometry.swift
          - Sidebar/BrowserSidebarSnapshot.swift
          - OpenAPI/**
        excludes:
          - Browser*Controller.swift
          - Browser*View.swift
          - BrowserChromiumExtensionManager.swift
          - BrowserRuntimeConfiguration.swift
          - BrowserTabControllerDriver.swift
          - BrowserWindowSessions.swift
      - path: Backend/openapi.yaml
        group: Sources/Browser/OpenAPI
      - path: Tests/OpenArcTests
    buildToolPlugins:
      - plugin: OpenAPIGenerator
        package: SwiftOpenAPIGenerator
    settings:
      base:
        BUNDLE_LOADER: ""
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: OpenArcTests
        TEST_HOST: ""
    dependencies:
      - package: DomainParser
      - package: Gzip
      - package: GRDB
      - package: Sentry
      - package: Settings
      - package: OpenAPIRuntime
      - package: OpenAPIURLSession
      - package: ZIPFoundation
  OpenArciOS:
    templates:
      - BrowserSyncCore
    type: application
    platform: iOS
    productName: OpenArc
    sources:
      - path: Sources/BrowseriOS
      - path: Sources/Browser/BrowserNavigationResolver.swift
      - path: Sources/Browser/BrowserSearchEngine.swift
      - path: Sources/Browser/BrowserStrings.swift
      - path: Sources/Browser/Resources/en.lproj/Localizable.strings
      - path: Sources/Browser/Resources/Credits.html
    dependencies:
      - package: DomainParser
    settings:
      base:
        PRODUCT_NAME: OpenArc
        PRODUCT_BUNDLE_IDENTIFIER: com.levochkaa.OpenArc.ios
        INFOPLIST_FILE: Support/OpenArciOS-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/OpenArciOS.entitlements
        OPENARC_SYNC_BASE_URL: ""
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: NO
    scheme:
      gatherCoverageData: false
      testTargets:
        - OpenArciOSTests
  BrowserMobileTestHost:
    type: application
    platform: iOS
    sources:
      - path: Tests/BrowserMobileTestHost
    dependencies:
      # Keep Bundle.module's main-bundle lookup valid in hosted tests.
      - package: DomainParser
    settings:
      base:
        PRODUCT_NAME: BrowserMobileTestHost
        PRODUCT_BUNDLE_IDENTIFIER: com.levochkaa.OpenArc.ios-test-host
        INFOPLIST_FILE: Support/BrowserMobileTestHost-Info.plist
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: NO
  OpenArciOSTests:
    templates:
      - BrowserSyncCore
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Sources/BrowseriOS
        excludes:
          - AppDelegate.swift
          - SceneDelegate.swift
      - path: Sources/Browser/BrowserNavigationResolver.swift
      - path: Sources/Browser/BrowserSearchEngine.swift
      - path: Sources/Browser/BrowserStrings.swift
      - path: Sources/Browser/Resources/en.lproj/Localizable.strings
      - path: Tests/OpenArciOSTests
    dependencies:
      - package: DomainParser
      - target: BrowserMobileTestHost
        link: false
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        INFOPLIST_FILE: Support/OpenArciOSTests-Info.plist
        PRODUCT_NAME: OpenArciOSTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/BrowserMobileTestHost.app/BrowserMobileTestHost
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_STRICT_CONCURRENCY: complete
