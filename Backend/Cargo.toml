[package]
name = "openarc-sync-server"
version = "0.1.0"
edition = "2024"
publish = false
description = "OpenArc authentication, device registration, sync and update server."

[[bin]]
name = "openarc-sync-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
brotli = "9.0.0"
bytes = "1.12.1"
chrono = "0.4.45"
deadpool-postgres = "0.14.2"
flate2 = "1.1.10"
futures-util = "0.3.34"
hex = "0.4.3"
http-body = "1.1.0"
http-body-util = "0.1.5"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto", "use_pem"] }
postgres-types = { version = "0.2.14", features = ["with-chrono-0_4"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
ryu-js = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
serde_yaml = "0.9.34"
sha1 = "0.11.0"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
tokio-postgres-rustls = "0.14.0"
tower = "0.5"
tower-http = { version = "0.7.1", features = ["compression-gzip", "compression-br", "compression-deflate"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }
webpki-roots = "1.0.11"

[dev-dependencies]
rsa = "0.9"
rand = "0.8"

[profile.release]
lto = "thin"
codegen-units = 4
