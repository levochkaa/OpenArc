openapi: 3.0.3
info:
  title: OpenArc Sync API
  version: 0.1.0
  description: Backend API for OpenArc authentication, device registration, sync, and app updates.
servers:
  - url: https://api.openarc.su
  - url: http://localhost:3000
tags:
  - name: System
  - name: Authentication
  - name: Account
  - name: Devices
  - name: Sync
  - name: Updates
  - name: Shares
paths:
  /health:
    get:
      operationId: checkHealth
      tags: [System]
      responses:
        "200":
          description: Service health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/auth/apple:
    post:
      operationId: authenticateWithApple
      description: Native Sign in with Apple, from an app the identity token's audience lists.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthAppleRequest"
      responses:
        "201":
          description: Sync access token and registered device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/providers:
    get:
      operationId: listAuthProviders
      description: The sign-in methods this server is configured for.
      tags: [Authentication]
      responses:
        "200":
          description: Configured sign-in methods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProvidersResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/web/{provider}/start:
    get:
      operationId: startWebSignIn
      description: >-
        Opened in a web authentication session, never called directly. Redirects
        to the provider; once the user signs in, the server redirects to
        `openarc-auth://callback?code=CODE`, or `openarc-auth://callback?error=REASON`
        (`access_denied`, `provider_error` or `expired`). The code is single use,
        expires after five minutes and is exchanged with the verifier whose
        challenge started the sign-in.
      tags: [Authentication]
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [apple, google, github]
        - name: code_challenge
          in: query
          required: true
          description: Base64url SHA-256 of the client's code verifier, without padding.
          schema:
            type: string
            minLength: 43
            maxLength: 43
      responses:
        "303":
          description: Redirect to the provider's sign-in page.
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/web/exchange:
    post:
      operationId: exchangeWebSignIn
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthWebExchangeRequest"
      responses:
        "201":
          description: Sync access token and registered device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/email/start:
    post:
      operationId: startEmailSignIn
      description: Emails a six-digit sign-in code. Asking again within `resendIn` seconds returns 429.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthEmailStartRequest"
      responses:
        "202":
          description: The code was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEmailStartResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/email/verify:
    post:
      operationId: verifyEmailSignIn
      description: A wrong code counts toward five attempts, after which the code expires.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthEmailVerifyRequest"
      responses:
        "201":
          description: Sync access token and registered device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/account:
    delete:
      operationId: deleteAccount
      description: >-
        Deletes the signed-in account and everything the server stores for it:
        devices, sign-in methods, synced Spaces, folders, tabs and Boosts, the
        event history, tombstones and mutation receipts. Sign in with Apple
        refresh tokens the server holds are revoked at Apple. Access tokens of
        the account stop working on every device. An account that is already
        deleted answers 204 again, so a client can retry after a lost reply.
        At most five requests per account in 15 minutes; more answer 429.
      tags: [Account]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The account is deleted.
        default:
          $ref: "#/components/responses/Error"
  /v1/devices:
    post:
      operationId: registerDevice
      tags: [Devices]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceRequest"
      responses:
        "200":
          description: Registered device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterDeviceResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/sync/push:
    post:
      operationId: pushSync
      tags: [Sync]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPushRequest"
      responses:
        "201":
          description: Sync cursor and accepted remote events.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SyncResponse"
                  - $ref: "#/components/schemas/SyncResponseV4"
                  - $ref: "#/components/schemas/SyncResponseV5"
                  - $ref: "#/components/schemas/SyncResponseV6"
        "409":
          description: This account already used mutationID with different parsed content or a different protocol version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/sync/pull:
    post:
      operationId: pullSync
      tags: [Sync]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/SyncPullRequest"
                - $ref: "#/components/schemas/SyncPullRequestV4"
                - $ref: "#/components/schemas/SyncPullRequestV5"
                - $ref: "#/components/schemas/SyncPullRequestV6"
      responses:
        "201":
          description: Sync cursor and remote events after the requested cursor.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SyncResponse"
                  - $ref: "#/components/schemas/SyncResponseV4"
                  - $ref: "#/components/schemas/SyncResponseV5"
                  - $ref: "#/components/schemas/SyncResponseV6"
        "409":
          description: First protocol 4, 5 or 6 bootstrap requires cursor 0. Older pulls reset the corresponding per-device bootstrap marker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/shares:
    post:
      operationId: publishShare
      description: >-
        Publishes a Space, a folder or a quote as a public link. Sharing the same Space or folder (`sourceID`) or the
        same quote again updates its link. An account can publish 60 times an hour and keep 1,000 links.
      tags: [Shares]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharePublishRequest"
      responses:
        "201":
          description: The link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareSummary"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listShares
      description: The account's links, the most recently shared first.
      tags: [Shares]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The account's links.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareListResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/shares/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: readShare
      description: A link's content, readable by anyone with the link.
      tags: [Shares]
      responses:
        "200":
          description: The shared content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedContent"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteShare
      description: Removes one of the account's links; its page then says it was removed.
      tags: [Shares]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Error"
  /v1/releases:
    get:
      operationId: listReleases
      tags: [Updates]
      parameters:
        - name: channel
          in: query
          schema:
            type: string
            enum: [all, stable, beta]
            default: all
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Public release index.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseIndexResponse"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ShareItem:
      type: object
      description: >-
        A tab or a folder. `parent` is the index of an earlier folder in the same list; items without one sit at the
        top level.
      required: [type]
      properties:
        type:
          type: string
          enum: [tab, folder]
        title:
          type: string
          nullable: true
          maxLength: 300
        url:
          type: string
          nullable: true
          description: An http or https address; tabs only.
        favicon:
          type: string
          nullable: true
          description: A PNG of at most 12 KiB as a `data:image/png;base64,` URL; tabs only.
        icon:
          type: string
          nullable: true
          description: An emoji or a symbol name; folders only.
        parent:
          type: integer
          nullable: true
          minimum: 0
    SharePublishRequest:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [space, folder, quote]
        sourceID:
          type: string
          description: The shared Space or folder; required for both.
          minLength: 1
          maxLength: 200
        title:
          type: string
          nullable: true
          description: The Space or folder name, required for both; for a quote, its page's title.
          maxLength: 300
        icon:
          type: string
          nullable: true
          description: An emoji or a symbol name.
        iconImage:
          type: string
          nullable: true
          description: The icon drawn as a PNG data URL, for viewers without the symbol.
        colors:
          type: array
          maxItems: 8
          items:
            type: string
            description: "#RRGGBB"
        items:
          type: array
          description: Space and folder only, at least one tab.
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ShareItem"
        text:
          type: string
          description: The quote; quote only.
          maxLength: 2000
        url:
          type: string
          description: The quoted page, with a text fragment that opens it at the quote; quote only.
        favicon:
          type: string
          nullable: true
          description: The quoted site's icon as a PNG data URL; quote only.
    ShareSummary:
      type: object
      required: [id, kind, url, sourceID, title, itemCount, createdAt, updatedAt]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [space, folder, quote]
        url:
          type: string
          description: The public page.
        sourceID:
          type: string
        title:
          type: string
        excerpt:
          type: string
          nullable: true
          description: A quote's opening words.
        itemCount:
          type: integer
          description: The tabs a Space or folder shares.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ShareListResponse:
      type: object
      required: [shares]
      properties:
        shares:
          type: array
          items:
            $ref: "#/components/schemas/ShareSummary"
    SharedContent:
      type: object
      required: [id, kind, shareURL, createdAt, updatedAt]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [space, folder, quote]
        shareURL:
          type: string
          description: The public page.
        url:
          type: string
          description: The quoted page; quote only.
        title:
          type: string
        icon:
          type: string
        iconImage:
          type: string
        colors:
          type: array
          items:
            type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShareItem"
        text:
          type: string
        favicon:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: true
      properties:
        statusCode:
          type: integer
        error:
          type: string
        message:
          type: string
    HealthResponse:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok:
          type: boolean
    Device:
      type: object
      required: [id, name, platform, lastSeenAt]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        platform:
          type: string
        publicKey:
          type: string
        lastSeenAt:
          type: string
          nullable: true
          format: date-time
    User:
      type: object
      required: [id, email]
      additionalProperties: false
      properties:
        id:
          type: string
        email:
          type: string
          nullable: true
    AuthAppleRequest:
      type: object
      required: [identityToken, deviceName, devicePlatform]
      additionalProperties: false
      properties:
        identityToken:
          type: string
          minLength: 1
        authorizationCode:
          type: string
          minLength: 1
          maxLength: 1024
          description: >-
            The authorization code from the same sign-in. With a Sign in with
            Apple key configured, the server redeems it for a refresh token,
            which deleting the account revokes.
        deviceName:
          type: string
          minLength: 1
          maxLength: 120
        devicePlatform:
          type: string
          minLength: 1
          maxLength: 60
    AuthProvidersResponse:
      type: object
      required: [providers]
      additionalProperties: false
      properties:
        providers:
          type: array
          description: >-
            Currently apple, google, github and email. Clients skip values they
            do not know, so a server can add methods.
          items:
            type: string
    AuthWebExchangeRequest:
      type: object
      required: [code, codeVerifier, deviceName, devicePlatform]
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 200
        codeVerifier:
          type: string
          minLength: 43
          maxLength: 128
        deviceName:
          type: string
          minLength: 1
          maxLength: 120
        devicePlatform:
          type: string
          minLength: 1
          maxLength: 60
    AuthEmailStartRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
    AuthEmailStartResponse:
      type: object
      required: [expiresIn, resendIn]
      additionalProperties: false
      properties:
        expiresIn:
          type: integer
          description: Seconds the code stays valid.
        resendIn:
          type: integer
          description: Seconds before another code can be sent.
    AuthEmailVerifyRequest:
      type: object
      required: [email, code, deviceName, devicePlatform]
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
        code:
          type: string
          pattern: "^[0-9]{6}$"
        deviceName:
          type: string
          minLength: 1
          maxLength: 120
        devicePlatform:
          type: string
          minLength: 1
          maxLength: 60
    AuthSessionResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user, device]
      additionalProperties: false
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
        user:
          $ref: "#/components/schemas/User"
        device:
          $ref: "#/components/schemas/Device"
    RegisterDeviceRequest:
      type: object
      required: [name, platform]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        platform:
          type: string
          minLength: 1
          maxLength: 60
        publicKey:
          type: string
          maxLength: 4096
    RegisterDeviceResponse:
      type: object
      required: [device]
      additionalProperties: false
      properties:
        device:
          $ref: "#/components/schemas/Device"
    SpacePayload:
      type: object
      required: [title, systemImageName, rank]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
        systemImageName:
          type: string
          minLength: 1
        rank:
          type: number
        isPinnedSectionCollapsed:
          type: boolean
        selectedTabID:
          type: string
          nullable: true
    TabPayload:
      type: object
      required: [spaceID, placement, rank, urlString]
      additionalProperties: false
      properties:
        spaceID:
          type: string
          minLength: 1
        placement:
          type: string
          enum: [temporary, spacePinned, app]
          description: >-
            app Favorites are global and survive deletion of their historical
            spaceID. Explicit deletion of the tab remains permanent.
        rank:
          type: number
        urlString:
          type: string
          minLength: 1
        pinnedURLString:
          type: string
          nullable: true
          minLength: 1
          description: >-
            Pinned home URL independent of the current URL. For spacePinned,
            omission preserves the stored home (or defaults to urlString for a
            new tab); explicit null clears it. Other placements always clear it.
        title:
          type: string
          nullable: true
        userTitleOverride:
          type: string
          nullable: true
        faviconURLString:
          type: string
          nullable: true
        lastActivityAt:
          type: string
          nullable: true
          format: date-time
          description: >-
            UTC activity timestamp. Existing live tabs retain the maximum of stored and incoming values;
            null or omission cannot erase known activity. A new tab with null or omitted activity remains null.
            Newly written tab-upsert events encode non-null activity in UTC with six fractional digits.
            ACK and pull may also echo historical events in their unchanged format. Stored mutation receipts
            remain unchanged. Activity cannot restore a tombstoned tab.
    SyncChange:
      description: >-
        Deleted entity IDs remain tombstoned. An ordinary upsert cannot restore
        them and returns the authoritative delete event. Explicit user restore
        creates a new entity ID. Push acknowledgements are not a pull cursor.
      oneOf:
        - type: object
          required: [entityType, entityID, op]
          additionalProperties: false
          properties:
            entityType:
              type: string
              enum: [space]
            entityID:
              type: string
              minLength: 1
            op:
              type: string
              enum: [upsert, delete]
            data:
              $ref: "#/components/schemas/SpacePayload"
        - type: object
          required: [entityType, entityID, op]
          additionalProperties: false
          properties:
            entityType:
              type: string
              enum: [tab]
            entityID:
              type: string
              minLength: 1
            op:
              type: string
              enum: [upsert, delete]
            data:
              $ref: "#/components/schemas/TabPayload"
    SyncPushRequest:
      oneOf:
      - $ref: '#/components/schemas/LegacySyncPushRequest'
      - $ref: '#/components/schemas/SemanticSyncPushRequest'
      - $ref: '#/components/schemas/SyncPushRequestV4'
      - $ref: '#/components/schemas/SyncPushRequestV5'
      - $ref: '#/components/schemas/SyncPushRequestV6'
    LegacySyncPushRequest:
      type: object
      description: Omit protocolVersion and mutationID for legacy v1. Supply both for v2. Retries with
        the same account, mutationID, and parsed payload return the original receipt; a different payload
        returns 409. Device rotation is allowed. In folder-bearing pinned Spaces, an existing v2 snapshot
        preserves current Space, placement, rank, folder membership and pinned home while applying metadata.
        New v2 pinned tabs append at the root using server rank. Explicit deletes remain terminal.
      required:
      - deviceID
      - changes
      additionalProperties: false
      properties:
        deviceID:
          type: string
        protocolVersion:
          type: integer
          enum:
          - 2
        mutationID:
          type: string
          format: uuid
        changes:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/SyncChange'
    SemanticSyncPushRequest:
      type: object
      additionalProperties: false
      properties:
        deviceID:
          type: string
          format: uuid
        protocolVersion:
          type: integer
          enum:
          - 3
        mutationID:
          type: string
          format: uuid
        operations:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/SyncOperation'
      required:
      - deviceID
      - protocolVersion
      - mutationID
      - operations
      description: Operations execute in request order in one account transaction. Semantic rejections
        are recorded and later operations continue; storage errors roll back the whole transaction. Mutation
        IDs share the v2 account namespace. Reusing an ID with different content or another protocol
        version returns 409. Retries return the original durable receipt, excluding deviceID from content
        identity. Maximum inflated JSON request size is 8 MiB. V3 create or move into a pinned Space with
        live folders is rejected with upgrade_required. Metadata patches and deletes preserve folder
        membership and mixed sibling ranks; explicit moves out clear incompatible membership.
    SpaceCreateData:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
        systemImageName:
          type: string
          minLength: 1
        isPinnedSectionCollapsed:
          type: boolean
        selectedTabID:
          type: string
          nullable: true
      required:
      - title
      - systemImageName
    TabCreateData:
      type: object
      additionalProperties: false
      properties:
        spaceID:
          type: string
          minLength: 1
        placement:
          type: string
          enum:
          - temporary
          - spacePinned
          - app
          description: app Favorites are global and survive deletion of their historical spaceID. Explicit
            deletion of the tab remains permanent.
        urlString:
          type: string
          minLength: 1
        pinnedURLString:
          type: string
          nullable: true
          minLength: 1
          description: Pinned home URL independent of the current URL. For spacePinned, omission preserves
            the stored home (or defaults to urlString for a new tab); explicit null clears it. Other
            placements always clear it.
        title:
          type: string
          nullable: true
        userTitleOverride:
          type: string
          nullable: true
        faviconURLString:
          type: string
          nullable: true
        lastActivityAt:
          type: string
          nullable: true
          format: date-time
          description: >-
            UTC activity timestamp. Existing live tabs retain the maximum of stored and incoming values;
            null or omission cannot erase known activity. A new tab with null or omitted activity remains null.
            Newly written tab-upsert events encode non-null activity in UTC with six fractional digits.
            ACK and pull may also echo historical events in their unchanged format. Stored mutation receipts
            remain unchanged. Activity cannot restore a tombstoned tab.
      required:
      - spaceID
      - placement
      - urlString
    SpacePatchFields:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
        systemImageName:
          type: string
          minLength: 1
        isPinnedSectionCollapsed:
          type: boolean
        selectedTabID:
          type: string
          nullable: true
      minProperties: 1
      description: Absent fields remain unchanged. Explicit null clears selectedTabID. Rank is assigned
        by the server.
    TabPatchFields:
      type: object
      additionalProperties: false
      properties:
        urlString:
          type: string
          minLength: 1
        pinnedURLString:
          type: string
          nullable: true
          minLength: 1
          description: Pinned home URL independent of the current URL. For spacePinned, omission preserves
            the stored home (or defaults to urlString for a new tab); explicit null clears it. Other
            placements always clear it.
        title:
          type: string
          nullable: true
        userTitleOverride:
          type: string
          nullable: true
        faviconURLString:
          type: string
          nullable: true
