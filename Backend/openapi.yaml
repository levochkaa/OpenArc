        - type: object
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - tabs
            spaceID:
              type: string
              minLength: 1
            placement:
              type: string
              enum:
                - temporary
                - spacePinned
                - app
            pinnedFolderID:
              type: string
              minLength: 1
              nullable: true
          required:
            - kind
            - spaceID
            - placement
            - pinnedFolderID
      description: >-
        Only Space items can target kind=spaces. Only tab/folder items can target kind=tabs; folders require
        spacePinned. Non-pinned destinations require pinnedFolderID=null. A non-null target folder must belong to
        the live target Space.
    SyncOperationV4:
      description: >-
        Operations execute in request order. Typed before/after anchors distinguish folders from tabs even when
        IDs match. Remove movers first, use a live before anchor in the target container, otherwise a live after
        anchor, otherwise append. Move items are unique by (entityType, entityID), cannot be their own anchors,
        and surviving items retain request order as one block. Selecting a folder with any selected descendant
        rejects the entire move with overlapping_items. Moving a folder into its own subtree rejects with cycle.
        Missing items remain absent and tombstones remain terminal. A valid folder move carries its current
        subtree, including all descendant Space IDs, atomically. A folder delete permanently deletes its current
        descendants and member tabs; a Space delete also deletes its folders and non-app tabs. Global Favorites
        survive Space deletion. Metadata patches cannot change rank or membership. Pin transitions retain an
        existing pinned home, derive a newly pinned home from the current URL, and clear it on unpinning. Changed
        siblings emit full canonical upserts.
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - create
            entityType:
              type: string
              enum:
                - space
            entityID:
              type: string
              minLength: 1
            data:
              $ref: '#/components/schemas/SpaceCreateData'
            before:
              $ref: '#/components/schemas/SyncAnchorV4'
            after:
              $ref: '#/components/schemas/SyncAnchorV4'
