openapi: 3.0.3
info:
  title: OpenArc Sync API
  version: 0.1.0
  description: Backend API for OpenArc authentication, device registration, sync, and app updates.
servers:
  - url: https://updates.openarc.app
  - url: http://localhost:3000
tags:
  - name: System
  - name: Authentication
  - name: Devices
  - name: Sync
  - name: Updates
paths:
  /health:
    get:
      operationId: checkHealth
      tags: [System]
      responses:
        "200":
          description: Service health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/auth/apple:
    post:
      operationId: authenticateWithApple
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthAppleRequest"
      responses:
        "200":
          description: Sync access token and registered device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthAppleResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/devices:
    post:
      operationId: registerDevice
      tags: [Devices]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceRequest"
      responses:
        "200":
          description: Registered device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterDeviceResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/sync/push:
    post:
      operationId: pushSync
      tags: [Sync]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPushRequest"
      responses:
        "201":
          description: Sync cursor and accepted remote events.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SyncResponse"
                  - $ref: "#/components/schemas/SyncResponseV4"
                  - $ref: "#/components/schemas/SyncResponseV5"
        "409":
          description: This account already used mutationID with different parsed content or a different protocol version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/sync/pull:
    post:
      operationId: pullSync
      tags: [Sync]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/SyncPullRequest"
                - $ref: "#/components/schemas/SyncPullRequestV4"
                - $ref: "#/components/schemas/SyncPullRequestV5"
      responses:
        "201":
          description: Sync cursor and remote events after the requested cursor.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SyncResponse"
                  - $ref: "#/components/schemas/SyncResponseV4"
                  - $ref: "#/components/schemas/SyncResponseV5"
        "409":
          description: First protocol 4 or 5 bootstrap requires cursor 0. Older pulls reset the corresponding per-device bootstrap marker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/releases:
    get:
      operationId: listReleases
      tags: [Updates]
      parameters:
        - name: channel
          in: query
          schema:
            type: string
            enum: [all, stable, beta]
            default: all
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Public release index.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseIndexResponse"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: true
      properties:
        statusCode:
          type: integer
        error:
          type: string
        message:
          type: string
    HealthResponse:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok:
          type: boolean
    Device:
      type: object
      required: [id, name, platform, lastSeenAt]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        platform:
          type: string
        publicKey:
          type: string
        lastSeenAt:
          type: string
          nullable: true
          format: date-time
    User:
      type: object
      required: [id, email]
      additionalProperties: false
      properties:
        id:
          type: string
        email:
          type: string
          nullable: true
    AuthAppleRequest:
      type: object
      required: [identityToken, deviceName, devicePlatform]
      additionalProperties: false
      properties:
        identityToken:
          type: string
          minLength: 1
        deviceName:
          type: string
          minLength: 1
          maxLength: 120
        devicePlatform:
          type: string
          minLength: 1
          maxLength: 60
    AuthAppleResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user, device]
      additionalProperties: false
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
        user:
          $ref: "#/components/schemas/User"
        device:
          $ref: "#/components/schemas/Device"
    RegisterDeviceRequest:
      type: object
      required: [name, platform]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        platform:
          type: string
          minLength: 1
          maxLength: 60
        publicKey:
          type: string
          maxLength: 4096
    RegisterDeviceResponse:
      type: object
      required: [device]
      additionalProperties: false
      properties:
        device:
          $ref: "#/components/schemas/Device"
    SpacePayload:
      type: object
      required: [title, systemImageName, rank]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
        systemImageName:
          type: string
          minLength: 1
        rank:
          type: number
        isPinnedSectionCollapsed:
          type: boolean
        selectedTabID:
          type: string
          nullable: true
    TabPayload:
      type: object
      required: [spaceID, placement, rank, urlString]
      additionalProperties: false
      properties:
        spaceID:
          type: string
          minLength: 1
        placement:
          type: string
          enum: [temporary, spacePinned, app]
          description: >-
            app Favorites are global and survive deletion of their historical
            spaceID. Explicit deletion of the tab remains permanent.
        rank:
          type: number
        urlString:
          type: string
          minLength: 1
        pinnedURLString:
          type: string
          nullable: true
          minLength: 1
          description: >-
            Pinned home URL independent of the current URL. For spacePinned,
            omission preserves the stored home (or defaults to urlString for a
            new tab); explicit null clears it. Other placements always clear it.
        title:
          type: string
          nullable: true
        userTitleOverride:
          type: string
          nullable: true
        faviconURLString:
          type: string
          nullable: true
        lastActivityAt:
          type: string
          nullable: true
          format: date-time
          description: >-
            UTC activity timestamp. Existing live tabs retain the maximum of stored and incoming values;
            null or omission cannot erase known activity. A new tab with null or omitted activity remains null.
            Newly written tab-upsert events encode non-null activity in UTC with six fractional digits.
            ACK and pull may also echo historical events in their unchanged format. Stored mutation receipts
            remain unchanged. Activity cannot restore a tombstoned tab.
    SyncChange:
      description: >-
        Deleted entity IDs remain tombstoned. An ordinary upsert cannot restore
        them and returns the authoritative delete event. Explicit user restore
        creates a new entity ID. Push acknowledgements are not a pull cursor.
      oneOf:
        - type: object
          required: [entityType, entityID, op]
          additionalProperties: false
          properties:
            entityType:
              type: string
              enum: [space]
            entityID:
              type: string
              minLength: 1
            op:
              type: string
              enum: [upsert, delete]
            data:
              $ref: "#/components/schemas/SpacePayload"
        - type: object
          required: [entityType, entityID, op]
          additionalProperties: false
          properties:
            entityType:
              type: string
              enum: [tab]
            entityID:
              type: string
              minLength: 1
            op:
              type: string
              enum: [upsert, delete]
            data:
              $ref: "#/components/schemas/TabPayload"
    SyncPushRequest:
      oneOf:
      - $ref: '#/components/schemas/LegacySyncPushRequest'
      - $ref: '#/components/schemas/SemanticSyncPushRequest'
      - $ref: '#/components/schemas/SyncPushRequestV4'
      - $ref: '#/components/schemas/SyncPushRequestV5'
    LegacySyncPushRequest:
      type: object
      description: Omit protocolVersion and mutationID for legacy v1. Supply both for v2. Retries with
        the same account, mutationID, and parsed payload return the original receipt; a different payload
        returns 409. Device rotation is allowed. In folder-bearing pinned Spaces, an existing v2 snapshot
        preserves current Space, placement, rank, folder membership and pinned home while applying metadata.
        New v2 pinned tabs append at the root using server rank. Explicit deletes remain terminal.
      required:
      - deviceID
      - changes
      additionalProperties: false
      properties:
        deviceID:
          type: string
        protocolVersion:
          type: integer
          enum:
          - 2
        mutationID:
          type: string
          format: uuid
        changes:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/SyncChange'
    SemanticSyncPushRequest:
      type: object
      additionalProperties: false
      properties:
        deviceID:
          type: string
          format: uuid
        protocolVersion:
          type: integer
          enum:
          - 3
        mutationID:
          type: string
          format: uuid
        operations:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/SyncOperation'
      required:
      - deviceID
      - protocolVersion
      - mutationID
      - operations
      description: Operations execute in request order in one account transaction. Semantic rejections
        are recorded and later operations continue; storage errors roll back the whole transaction. Mutation
        IDs share the v2 account namespace. Reusing an ID with different content or another protocol
        version returns 409. Retries return the original durable receipt, excluding deviceID from content
        identity. Maximum inflated JSON request size is 8 MiB. V3 create or move into a pinned Space with
        live folders is rejected with upgrade_required. Metadata patches and deletes preserve folder
        membership and mixed sibling ranks; explicit moves out clear incompatible membership.
    SpaceCreateData:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
        systemImageName:
          type: string
          minLength: 1
        isPinnedSectionCollapsed:
          type: boolean
        selectedTabID:
          type: string
          nullable: true
      required:
      - title
      - systemImageName
    TabCreateData:
      type: object
      additionalProperties: false
      properties:
        spaceID:
          type: string
          minLength: 1
        placement:
          type: string
          enum:
          - temporary
          - spacePinned
          - app
          description: app Favorites are global and survive deletion of their historical spaceID. Explicit
            deletion of the tab remains permanent.
        urlString:
          type: string
          minLength: 1
        pinnedURLString:
          type: string
          nullable: true
          minLength: 1
          description: Pinned home URL independent of the current URL. For spacePinned, omission preserves
            the stored home (or defaults to urlString for a new tab); explicit null clears it. Other
            placements always clear it.
        title:
          type: string
          nullable: true
        userTitleOverride:
          type: string
          nullable: true
        faviconURLString:
          type: string
          nullable: true
        lastActivityAt:
          type: string
          nullable: true
          format: date-time
          description: >-
            UTC activity timestamp. Existing live tabs retain the maximum of stored and incoming values;
            null or omission cannot erase known activity. A new tab with null or omitted activity remains null.
            Newly written tab-upsert events encode non-null activity in UTC with six fractional digits.
            ACK and pull may also echo historical events in their unchanged format. Stored mutation receipts
            remain unchanged. Activity cannot restore a tombstoned tab.
      required:
      - spaceID
      - placement
      - urlString
    SpacePatchFields:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
        systemImageName:
          type: string
          minLength: 1
        isPinnedSectionCollapsed:
          type: boolean
        selectedTabID:
          type: string
          nullable: true
      minProperties: 1
      description: Absent fields remain unchanged. Explicit null clears selectedTabID. Rank is assigned
        by the server.
    TabPatchFields:
      type: object
      additionalProperties: false
      properties:
        urlString:
          type: string
          minLength: 1
        pinnedURLString:
          type: string
          nullable: true
          minLength: 1
          description: Pinned home URL independent of the current URL. For spacePinned, omission preserves
            the stored home (or defaults to urlString for a new tab); explicit null clears it. Other
            placements always clear it.
        title:
          type: string
          nullable: true
        userTitleOverride:
          type: string
          nullable: true
        faviconURLString:
          type: string
          nullable: true
        lastActivityAt:
          type: string
          nullable: true
          format: date-time
          description: >-
            UTC activity timestamp. Existing live tabs retain the maximum of stored and incoming values;
            null or omission cannot erase known activity. A new tab with null or omitted activity remains null.
            Newly written tab-upsert events encode non-null activity in UTC with six fractional digits.
            ACK and pull may also echo historical events in their unchanged format. Stored mutation receipts
            remain unchanged. Activity cannot restore a tombstoned tab.
      minProperties: 1
      description: >-
        Absent fields remain unchanged; explicit null clears nullable metadata except lastActivityAt,
        which retains known activity and only advances to a later timestamp. Moving uses a separate
        operation; spaceID, placement and rank are forbidden here.
    TabMoveDestination:
      type: object
      additionalProperties: false
      properties:
        spaceID:
          type: string
          minLength: 1
        placement:
          type: string
          enum:
          - temporary
          - spacePinned
          - app
      required:
      - spaceID
      - placement
    SyncOperation:
      description: 'Create and move accept optional nullable anchors: after removing movers, use a live
        beforeID in the target list, otherwise a live afterID, otherwise append. A move anchor among
        entityIDs is invalid. Survivors move as one block in request order; missing IDs stay absent and
        deleted IDs stay tombstoned. Non-app destinations require a live Space; an invalid destination
        rejects the whole move and preserves all source entities. App Favorites form one global list
        independent of their historical spaceID. Moving into spacePinned derives home from the current
        URL, retains home when already pinned, and clears home when leaving pinned placement. Server
        ranks are canonical within each list; changed peers emit full current upserts. Legacy v2 clients
        still submit full snapshots and can overwrite metadata or ranks outside folder-bearing pinned Spaces.'
      oneOf:
      - type: object
        additionalProperties: false
        properties:
          kind:
            type: string
            enum:
            - create
          entityType:
            type: string
            enum:
            - space
          entityID:
            type: string
            minLength: 1
          data:
            $ref: '#/components/schemas/SpaceCreateData'
          beforeID:
            type: string
            minLength: 1
            nullable: true
          afterID:
            type: string
            minLength: 1
            nullable: true
        required:
        - kind
        - entityType
        - entityID
        - data
      - type: object
        additionalProperties: false
        properties:
          kind:
            type: string
            enum:
            - create
          entityType:
            type: string
            enum:
            - tab
          entityID:
            type: string
            minLength: 1
          data:
            $ref: '#/components/schemas/TabCreateData'
          beforeID:
            type: string
            minLength: 1
            nullable: true
          afterID:
            type: string
            minLength: 1
            nullable: true
        required:
        - kind
        - entityType
        - entityID
        - data
      - type: object
        additionalProperties: false
        properties:
          kind:
            type: string
            enum:
            - patch
          entityType:
            type: string
            enum:
            - space
          entityID:
            type: string
            minLength: 1
          fields:
            $ref: '#/components/schemas/SpacePatchFields'
        required:
        - kind
        - entityType
        - entityID
        - fields
      - type: object
        additionalProperties: false
        properties:
          kind:
            type: string
            enum:
            - patch
          entityType:
            type: string
            enum:
            - tab
          entityID:
            type: string
            minLength: 1
          fields:
            $ref: '#/components/schemas/TabPatchFields'
        required:
        - kind
        - entityType
        - entityID
        - fields
      - type: object
        additionalProperties: false
        properties:
          kind:
            type: string
            enum:
            - move
          entityType:
            type: string
            enum:
            - space
          entityIDs:
            type: array
            minItems: 1
            maxItems: 1000
            uniqueItems: true
            items:
              type: string
              minLength: 1
          beforeID:
            type: string
            minLength: 1
            nullable: true
          afterID:
            type: string
            minLength: 1
            nullable: true
        required:
        - kind
        - entityType
        - entityIDs
      - type: object
        additionalProperties: false
        properties:
          kind:
            type: string
            enum:
            - move
          entityType:
            type: string
            enum:
            - tab
          entityIDs:
            type: array
            minItems: 1
            maxItems: 1000
            uniqueItems: true
            items:
              type: string
              minLength: 1
          beforeID:
            type: string
            minLength: 1
            nullable: true
          afterID:
            type: string
            minLength: 1
            nullable: true
          destination:
            $ref: '#/components/schemas/TabMoveDestination'
        required:
        - kind
        - entityType
        - entityIDs
        - destination
      - type: object
        additionalProperties: false
        properties:
          kind:
            type: string
            enum:
            - delete
          entityType:
            type: string
            enum:
            - space
            - tab
          entityID:
            type: string
            minLength: 1
        required:
        - kind
        - entityType
        - entityID
    SyncOperationOutcome:
      type: object
      additionalProperties: false
      properties:
        operationIndex:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
          - applied
          - deleted
          - rejected
        reason:
          type: string
          enum:
          - missing
          - entity_exists
          - target_missing
          - target_deleted
          - target_wrong_space
          - invalid_destination
          - cycle
          - overlapping_items
          - upgrade_required
          - state_changed
          - not_temporary
          - activity_unknown
          - not_expired
          - response_limit
      required:
      - operationIndex
      - status
      description: One outcome per operation, in request order. Applied moves may also return deletion
        events for tombstoned group members. Already deleted identities report deleted. Create on a live
        identity reports entity_exists and echoes its canonical state.
    SyncPullRequest:
      type: object
      required: [deviceID]
      additionalProperties: false
      description: >-
        Legacy pull omits protocolVersion and returns only Space/tab events without
        pinnedFolderID. Folder events are excluded before LIMIT, so a folder-only
        page cannot hide later visible events. Cursor advances to the last visible
        event; an empty response leaves it unchanged. Each legacy pull resets the
        device's v4 and v5 bootstrap markers.
      properties:
        deviceID:
          type: string
        cursor:
          type: integer
          minimum: 0
          default: 0
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 500
    SyncEvent:
      type: object
      required: [serverSeq, deviceID, entityType, entityID, op, data, createdAt]
      additionalProperties: false
      properties:
        serverSeq:
          type: integer
          minimum: 0
        deviceID:
          type: string
          nullable: true
        entityType:
          type: string
          enum: [space, tab]
        entityID:
          type: string
        op:
          type: string
          enum: [upsert, delete]
        data:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    SyncResponse:
      type: object
      description: Legacy pull retains protocolVersion 2 and advertises supportedPushVersions [2, 3, 4, 5]. A v2 or
        v3 push receipt echoes its protocolVersion and mutationID and is durably retained without expiry.
        Clients must observe supportedPushVersions before uploading v3 operations. V3 receipts also include
        per-operation outcomes and authoritative events, deduplicated by serverSeq. Push cursors must
        never advance a pull cursor.
      required:
      - cursor
      - events
      additionalProperties: false
      properties:
        protocolVersion:
          type: integer
          enum:
          - 2
          - 3
        mutationID:
          type: string
          format: uuid
        cursor:
          type: integer
          minimum: 0
        events:
          type: array
          items:
            $ref: '#/components/schemas/SyncEvent'
        supportedPushVersions:
          type: array
          description: Present on pull responses. Exactly [2, 3, 4, 5] for this server. Version 5 accepts conditional expiry only.
          items:
            type: integer
            enum:
            - 2
            - 3
            - 4
            - 5
          minItems: 4
          maxItems: 4
          uniqueItems: true
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/SyncOperationOutcome'
    FolderPayload:
      type: object
      additionalProperties: false
      properties:
        spaceID:
          type: string
          minLength: 1
        parentFolderID:
          type: string
          minLength: 1
          nullable: true
        title:
          type: string
          minLength: 1
        systemImageName:
          type: string
          minLength: 1
          nullable: true
        rank:
          type: number
      required:
        - spaceID
        - parentFolderID
        - title
        - rank
      description: >-
        A folder is a pinned sibling in its Space or parent folder. parentFolderID is required: null means the
        Space pinned root. Expansion state is device-local.
    FolderCreateData:
      type: object
      additionalProperties: false
      properties:
        spaceID:
          type: string
          minLength: 1
        parentFolderID:
          type: string
          minLength: 1
          nullable: true
        title:
          type: string
          minLength: 1
        systemImageName:
          type: string
          minLength: 1
          nullable: true
      required:
        - spaceID
        - parentFolderID
        - title
      description: Create without rank; the server assigns mixed folder/tab sibling order.
    FolderPatchFields:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
        systemImageName:
          type: string
          nullable: true
          minLength: 1
      minProperties: 1
      description: >-
        Metadata only. Absent fields remain unchanged; null clears the icon. Parent, Space and rank change only
        through move.
    TabPayloadV4:
      type: object
      required:
        - spaceID
        - placement
        - rank
        - urlString
        - pinnedFolderID
      additionalProperties: false
      properties:
        spaceID:
          type: string
          minLength: 1
        placement:
          type: string
          enum:
            - temporary
            - spacePinned
            - app
          description: >-
            app Favorites are global and survive deletion of their historical spaceID. Explicit deletion of the
            tab remains permanent.
        rank:
          type: number
        urlString:
          type: string
          minLength: 1
        pinnedURLString:
          type: string
          nullable: true
          minLength: 1
          description: >-
            Pinned home URL independent of the current URL. For spacePinned, omission preserves the stored home
            (or defaults to urlString for a new tab); explicit null clears it. Other placements always clear it.
        title:
          type: string
          nullable: true
        userTitleOverride:
          type: string
          nullable: true
        faviconURLString:
          type: string
          nullable: true
        lastActivityAt:
          type: string
          nullable: true
          format: date-time
          description: >-
            UTC activity timestamp. Existing live tabs retain the maximum of stored and incoming values;
            null or omission cannot erase known activity. A new tab with null or omitted activity remains null.
            Newly written tab-upsert events encode non-null activity in UTC with six fractional digits.
            ACK and pull may also echo historical events in their unchanged format. Stored mutation receipts
            remain unchanged. Activity cannot restore a tombstoned tab.
        pinnedFolderID:
          type: string
          minLength: 1
          nullable: true
      description: >-
        pinnedFolderID is required: null means no folder. A non-null folder is allowed only for spacePinned and
        must be live in the specified Space. Global app Favorites and temporary tabs require null.
    TabCreateDataV4:
      type: object
      additionalProperties: false
      properties:
        spaceID:
          type: string
          minLength: 1
        placement:
          type: string
          enum:
            - temporary
            - spacePinned
            - app
          description: >-
            app Favorites are global and survive deletion of their historical spaceID. Explicit deletion of the
            tab remains permanent.
        urlString:
          type: string
          minLength: 1
        pinnedURLString:
          type: string
          nullable: true
          minLength: 1
          description: >-
            Pinned home URL independent of the current URL. For spacePinned, omission preserves the stored home
            (or defaults to urlString for a new tab); explicit null clears it. Other placements always clear it.
        title:
          type: string
          nullable: true
        userTitleOverride:
          type: string
          nullable: true
        faviconURLString:
          type: string
          nullable: true
        lastActivityAt:
          type: string
          nullable: true
          format: date-time
          description: >-
            UTC activity timestamp. Existing live tabs retain the maximum of stored and incoming values;
            null or omission cannot erase known activity. A new tab with null or omitted activity remains null.
            Newly written tab-upsert events encode non-null activity in UTC with six fractional digits.
            ACK and pull may also echo historical events in their unchanged format. Stored mutation receipts
            remain unchanged. Activity cannot restore a tombstoned tab.
        pinnedFolderID:
          type: string
          minLength: 1
          nullable: true
      required:
        - spaceID
        - placement
        - urlString
        - pinnedFolderID
      description: >-
        pinnedFolderID is required: null means no folder. A non-null folder is allowed only for spacePinned and
        must be live in the specified Space. Global app Favorites and temporary tabs require null.
    SyncEntityReferenceV4:
      type: object
      additionalProperties: false
      properties:
        entityType:
          type: string
          enum:
            - space
            - tab
            - folder
        entityID:
          type: string
          minLength: 1
      required:
        - entityType
        - entityID
    SyncAnchorV4:
      type: object
      additionalProperties: false
      properties:
        entityType:
          type: string
          enum:
            - space
            - tab
            - folder
        entityID:
          type: string
          minLength: 1
      required:
        - entityType
        - entityID
      nullable: true
    SyncDestinationV4:
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - spaces
          required:
            - kind
        - type: object
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - tabs
            spaceID:
              type: string
              minLength: 1
            placement:
              type: string
              enum:
                - temporary
                - spacePinned
                - app
            pinnedFolderID:
              type: string
              minLength: 1
              nullable: true
          required:
            - kind
            - spaceID
            - placement
            - pinnedFolderID
      description: >-
        Only Space items can target kind=spaces. Only tab/folder items can target kind=tabs; folders require
        spacePinned. Non-pinned destinations require pinnedFolderID=null. A non-null target folder must belong to
        the live target Space.
    SyncOperationV4:
      description: >-
        Operations execute in request order. Typed before/after anchors distinguish folders from tabs even when
        IDs match. Remove movers first, use a live before anchor in the target container, otherwise a live after
        anchor, otherwise append. Move items are unique by (entityType, entityID), cannot be their own anchors,
        and surviving items retain request order as one block. Selecting a folder with any selected descendant
        rejects the entire move with overlapping_items. Moving a folder into its own subtree rejects with cycle.
        Missing items remain absent and tombstones remain terminal. A valid folder move carries its current
        subtree, including all descendant Space IDs, atomically. A folder delete permanently deletes its current
        descendants and member tabs; a Space delete also deletes its folders and non-app tabs. Global Favorites
        survive Space deletion. Metadata patches cannot change rank or membership. Pin transitions retain an
        existing pinned home, derive a newly pinned home from the current URL, and clear it on unpinning. Changed
        siblings emit full canonical upserts.
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - create
            entityType:
              type: string
              enum:
                - space
            entityID:
              type: string
              minLength: 1
            data:
              $ref: '#/components/schemas/SpaceCreateData'
            before:
              $ref: '#/components/schemas/SyncAnchorV4'
            after:
              $ref: '#/components/schemas/SyncAnchorV4'
          required:
            - kind
            - entityType
            - entityID
            - data
        - type: object
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - create
            entityType:
              type: string
              enum:
                - tab
            entityID:
              type: string
              minLength: 1
            data:
              $ref: '#/components/schemas/TabCreateDataV4'
            before:
              $ref: '#/components/schemas/SyncAnchorV4'
            after:
              $ref: '#/components/schemas/SyncAnchorV4'
          required:
            - kind
            - entityType
            - entityID
            - data
        - type: object
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - create
            entityType:
              type: string
              enum:
                - folder
            entityID:
              type: string
              minLength: 1
            data:
              $ref: '#/components/schemas/FolderCreateData'
            before:
              $ref: '#/components/schemas/SyncAnchorV4'
            after:
              $ref: '#/components/schemas/SyncAnchorV4'
          required:
            - kind
            - entityType
            - entityID
            - data
        - type: object
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - patch
            entityType:
              type: string
              enum:
                - space
            entityID:
              type: string
              minLength: 1
            fields:
              $ref: '#/components/schemas/SpacePatchFields'
          required:
            - kind
            - entityType
            - entityID
            - fields
        - type: object
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - patch
            entityType:
              type: string
              enum:
                - tab
            entityID:
              type: string
              minLength: 1
            fields:
              $ref: '#/components/schemas/TabPatchFields'
          required:
            - kind
            - entityType
            - entityID
            - fields
        - type: object
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - patch
            entityType:
              type: string
              enum:
                - folder
            entityID:
              type: string
              minLength: 1
            fields:
              $ref: '#/components/schemas/FolderPatchFields'
          required:
            - kind
            - entityType
            - entityID
            - fields
        - type: object
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - move
            items:
              type: array
              minItems: 1
              maxItems: 1000
              uniqueItems: true
              items:
                $ref: '#/components/schemas/SyncEntityReferenceV4'
            destination:
              $ref: '#/components/schemas/SyncDestinationV4'
            before:
              $ref: '#/components/schemas/SyncAnchorV4'
            after:
              $ref: '#/components/schemas/SyncAnchorV4'
          required:
            - kind
            - items
            - destination
        - type: object
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - delete
            entityType:
              type: string
              enum:
                - space
                - tab
                - folder
            entityID:
              type: string
              minLength: 1
          required:
            - kind
            - entityType
            - entityID
    SyncPushRequestV4:
      type: object
      additionalProperties: false
      properties:
        deviceID:
          type: string
          format: uuid
        protocolVersion:
          type: integer
          enum:
            - 4
        mutationID:
          type: string
          format: uuid
        operations:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/SyncOperationV4'
      required:
        - deviceID
        - protocolVersion
        - mutationID
        - operations
      description: >-
        Durable idempotent v4 operations. Observe supportedPushVersions before upload. Versions 2, 3, 4 and 5 share
        account+mutationID identity: identical parsed content replays the original receipt, different content or
        protocol returns 409. deviceID is excluded from content identity. Operations, events, tombstones and
        receipt commit in one account transaction. Semantic rejection does not abort later operations; storage
        failure rolls back the entire batch. Maximum inflated JSON body is 8 MiB.
    SyncPullRequestV4:
      type: object
      additionalProperties: false
      properties:
        deviceID:
          type: string
          format: uuid
        protocolVersion:
          type: integer
          enum:
            - 4
        cursor:
          type: integer
          minimum: 0
          default: 0
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 500
      required:
        - deviceID
        - protocolVersion
      description: >-
        Opt in to folder events and tab membership. The first v4 pull for a device requires cursor 0, otherwise
        409. Any legacy pull resets this requirement: downgrade then upgrade must replay from zero. Consume every
        page and persist an independent v4 cursor/baseline; a legacy cursor skipped folder history and cannot
        bootstrap v4. A v4 pull resets the v5 recovery bootstrap marker.
    SyncEventV4:
      type: object
      required:
        - serverSeq
        - deviceID
        - entityType
        - entityID
        - op
        - data
        - createdAt
      additionalProperties: false
      properties:
        serverSeq:
          type: integer
          minimum: 0
        deviceID:
          type: string
          nullable: true
        entityType:
          type: string
          enum:
            - space
            - tab
            - folder
        entityID:
          type: string
        op:
          type: string
          enum:
            - upsert
            - delete
        data:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
      description: >-
        Canonical event history includes folders and tab pinnedFolderID. Historical tab upserts written before
        folder support return pinnedFolderID=null. Delete payloads identify the tombstoned entity. A conditional
        expiry delete also contains autoArchive (SyncAutoArchiveData): immutable canonical recovery content.
        Entity identity is (entityType, entityID).
    SyncResponseV4:
      type: object
      description: >-
        Negotiated v4 pulls include folder events and tab membership. V4 push receipts echo mutationID and include
        one outcome per operation; authoritative events are deduplicated by serverSeq. Receipts and tombstones
        have no expiry. Push cursor is only a server high-water mark and must never advance the pull cursor.
      required:
        - cursor
        - events
        - protocolVersion
      additionalProperties: false
      properties:
        protocolVersion:
          type: integer
          enum:
            - 4
        mutationID:
          type: string
          format: uuid
        cursor:
          type: integer
          minimum: 0
        events:
          type: array
          items:
            $ref: '#/components/schemas/SyncEventV4'
        supportedPushVersions:
          type: array
          description: Present on pull responses. Exactly [2, 3, 4, 5] for this server. Version 5 accepts conditional expiry only.
          items:
            type: integer
            enum:
              - 2
              - 3
              - 4
              - 5
          minItems: 4
          maxItems: 4
          uniqueItems: true
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/SyncOperationOutcome'
    SyncExpiryOperation:
      type: object
      additionalProperties: false
      required: [kind, entityType, entityID, expectedServerSeq, inactiveForSeconds]
      properties:
        kind:
          type: string
          enum: [expire]
        entityType:
          type: string
          enum: [tab]
        entityID:
          type: string
          minLength: 1
        expectedServerSeq:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Exact latest canonical upsert sequence for this tab; any intervening change rejects expiry.
        inactiveForSeconds:
          type: integer
          enum: [43200, 86400, 259200, 604800, 2592000]
          description: Server checks stored activity against its current time minus this interval. No client cutoff is accepted.
      description: >-
        Conditional automatic expiry of a live temporary tab. A known inactive timestamp and matching sequence
        are required. Missing/changed/pinned/unknown/not-yet-expired tabs are rejected without deletion.
        Existing tombstones return deleted. The server cannot know activity not yet reported by an offline client.
    SyncPushRequestV5:
      type: object
      additionalProperties: false
      required: [deviceID, protocolVersion, mutationID, operations]
      properties:
        deviceID:
          type: string
          format: uuid
        protocolVersion:
          type: integer
          enum: [5]
        mutationID:
          type: string
          format: uuid
        operations:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SyncExpiryOperation'
      description: >-
        Version 5 adds expiry-only requests on the existing push endpoint. Ordinary intents remain v4.
        Negotiate supportedPushVersions before upload. Account-scoped immutable receipts, device-independent
        digests and terminal outcomes follow the existing protocol. Rejected operations do not abort valid
        later operations; storage failure rolls back deletions, recovery payloads, events, tombstones and receipt.
        No optimistic local tombstone is safe before acceptance. Version 5 pull bootstraps recovery from cursor 0.
    SyncPullRequestV5:
      type: object
      additionalProperties: false
      required: [deviceID, protocolVersion]
      properties:
        deviceID:
          type: string
          format: uuid
        protocolVersion:
          type: integer
          enum: [5]
        cursor:
          type: integer
          minimum: 0
          default: 0
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 500
      description: >-
        Includes the v4 tree and conditional-expiry recovery data. First v5 pull after registration or an older
        pull requires cursor 0, otherwise 409. Older clients may already have discarded recovery while advancing
        their cursors. Read every page and atomically persist recovery receipts with the new baseline/cursor.
        Replaying recovery must not recreate entries previously restored, removed or cleared locally.
    SyncAutoArchiveData:
      type: object
      additionalProperties: false
      required: [archivedAt, sourceServerSeq, tab]
      properties:
        archivedAt:
          type: string
          format: date-time
          description: Server archive time in UTC with six fractional digits.
        sourceServerSeq:
          type: integer
          minimum: 1
          description: Sequence of the canonical live upsert captured before deletion.
        tab:
          type: object
          additionalProperties: true
          description: >-
            Prior canonical tab-upsert payload, including id, URL, titles, placement, rank, Space and activity.
            Historical missing pinnedFolderID is represented as null. No WebKit history, cookies or passwords.
      description: >-
        Recovery content on a tab delete event created by conditional expiry. It is immutable in event history
        and receipts. Clients must also preserve divergent local offline content before applying the deletion.
        Restore creates a fresh identity; recovery never resurrects the deleted ID.
    SyncResponseV5:
      type: object
      additionalProperties: false
      required: [protocolVersion, cursor, events]
      properties:
        protocolVersion:
          type: integer
          enum: [5]
        mutationID:
          type: string
          format: uuid
        cursor:
          type: integer
          minimum: 0
        events:
          type: array
          items:
            $ref: '#/components/schemas/SyncEventV4'
        supportedPushVersions:
          type: array
          description: Present on pull responses; v5 push is conditional expiry only.
          items:
            type: integer
            enum: [2, 3, 4, 5]
          minItems: 4
          maxItems: 4
          uniqueItems: true
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/SyncOperationOutcome'
      description: >-
        V5 pulls return recovery-capable event history and supportedPushVersions. V5 push receipts additionally
        require mutationID and one outcome per expiry operation. Accepted expiry returns a canonical delete with
        autoArchive; rejection echoes current state when present and within the response limit. Complete ACK bytes
        are bounded to 4 MiB. response_limit rejects an operation without deletion or oversized canonical echo;
        preimages are never truncated. A prior tombstone remains terminal. Exact retry replays the original
        receipt after later operations or server restart. A push cursor is not a pull cursor.
    ReleaseAsset:
      type: object
      required: [id, name, contentType, size, downloadCount, downloadURL]
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: string
        contentType:
          type: string
        size:
          type: integer
          nullable: true
          minimum: 0
        downloadCount:
          type: integer
          nullable: true
          minimum: 0
        downloadURL:
          type: string
          format: uri
    Release:
      type: object
      required: [id, tagName, name, channel, isLatestStable, publishedAt, htmlURL, notes, assets]
      additionalProperties: false
      properties:
        id:
          type: integer
        tagName:
          type: string
        name:
          type: string
        channel:
          type: string
          enum: [stable, beta]
        isLatestStable:
          type: boolean
        publishedAt:
          type: string
          nullable: true
          format: date-time
        htmlURL:
          type: string
          format: uri
        notes:
          type: string
        assets:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseAsset"
    ReleaseIndexResponse:
      type: object
      required: [releases]
      additionalProperties: false
      properties:
        releases:
          type: array
          items:
            $ref: "#/components/schemas/Release"
