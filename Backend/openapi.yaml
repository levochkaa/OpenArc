    SyncPushRequestV4:
      type: object
      additionalProperties: false
      properties:
        deviceID:
          type: string
          format: uuid
        protocolVersion:
          type: integer
          enum:
            - 4
        mutationID:
          type: string
          format: uuid
        operations:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/SyncOperationV4'
      required:
        - deviceID
        - protocolVersion
        - mutationID
        - operations
      description: >-
        Durable idempotent v4 operations. Observe supportedPushVersions before upload. Versions 2, 3, 4 and 5 share
        account+mutationID identity: identical parsed content replays the original receipt, different content or
        protocol returns 409. deviceID is excluded from content identity. Operations, events, tombstones and
        receipt commit in one account transaction. Semantic rejection does not abort later operations; storage
        failure rolls back the entire batch. Maximum inflated JSON body is 8 MiB.
    SyncPullRequestV4:
      type: object
      additionalProperties: false
      properties:
        deviceID:
          type: string
          format: uuid
        protocolVersion:
          type: integer
          enum:
            - 4
        cursor:
          type: integer
          minimum: 0
          default: 0
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 500
      required:
        - deviceID
        - protocolVersion
      description: >-
        Opt in to folder events and tab membership. The first v4 pull for a device requires cursor 0, otherwise
        409. Any legacy pull resets this requirement: downgrade then upgrade must replay from zero. Consume every
        page and persist an independent v4 cursor/baseline; a legacy cursor skipped folder history and cannot
        bootstrap v4. A v4 pull resets the v5 recovery bootstrap marker.
    SyncEventV4:
      type: object
      required:
        - serverSeq
        - deviceID
        - entityType
        - entityID
        - op
        - data
        - createdAt
      additionalProperties: false
      properties:
        serverSeq:
          type: integer
          minimum: 0
        deviceID:
          type: string
          nullable: true
        entityType:
          type: string
          enum:
            - space
            - tab
            - folder
        entityID:
          type: string
        op:
          type: string
          enum:
            - upsert
            - delete
        data:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
      description: >-
        Canonical event history includes folders and tab pinnedFolderID. Historical tab upserts written before
        folder support return pinnedFolderID=null. Delete payloads identify the tombstoned entity. A conditional
        expiry delete also contains autoArchive (SyncAutoArchiveData): immutable canonical recovery content.
        Boost events (SyncBoostData plus id) reach only v6 readers. Entity identity is (entityType, entityID).
    SyncResponseV4:
      type: object
      description: >-
        Negotiated v4 pulls include folder events and tab membership. V4 push receipts echo mutationID and include
        one outcome per operation; authoritative events are deduplicated by serverSeq. Receipts and tombstones
        have no expiry. Push cursor is only a server high-water mark and must never advance the pull cursor.
      required:
        - cursor
        - events
        - protocolVersion
      additionalProperties: false
      properties:
        protocolVersion:
          type: integer
          enum:
            - 4
        mutationID:
          type: string
          format: uuid
        cursor:
          type: integer
          minimum: 0
        events:
          type: array
          items:
            $ref: '#/components/schemas/SyncEventV4'
        supportedPushVersions:
          type: array
          description: Present on pull responses. Exactly [2, 3, 4, 5, 6] for this server. Version 5 accepts conditional expiry only; version 6 accepts boosts only.
          items:
            type: integer
            enum:
              - 2
              - 3
              - 4
              - 5
              - 6
          minItems: 5
          maxItems: 5
          uniqueItems: true
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/SyncOperationOutcome'
    SyncExpiryOperation:
      type: object
      additionalProperties: false
      required: [kind, entityType, entityID, expectedServerSeq, inactiveForSeconds]
      properties:
        kind:
          type: string
          enum: [expire]
        entityType:
          type: string
          enum: [tab]
        entityID:
          type: string
          minLength: 1
        expectedServerSeq:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Exact latest canonical upsert sequence for this tab; any intervening change rejects expiry.
        inactiveForSeconds:
          type: integer
          enum: [43200, 86400, 259200, 604800, 2592000]
          description: Server checks stored activity against its current time minus this interval. No client cutoff is accepted.
      description: >-
        Conditional automatic expiry of a live temporary tab. A known inactive timestamp and matching sequence
        are required. Missing/changed/pinned/unknown/not-yet-expired tabs are rejected without deletion.
        Existing tombstones return deleted. The server cannot know activity not yet reported by an offline client.
    SyncPushRequestV5:
      type: object
      additionalProperties: false
      required: [deviceID, protocolVersion, mutationID, operations]
      properties:
        deviceID:
          type: string
          format: uuid
        protocolVersion:
          type: integer
          enum: [5]
        mutationID:
          type: string
          format: uuid
        operations:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SyncExpiryOperation'
      description: >-
        Version 5 adds expiry-only requests on the existing push endpoint. Ordinary intents remain v4.
        Negotiate supportedPushVersions before upload. Account-scoped immutable receipts, device-independent
        digests and terminal outcomes follow the existing protocol. Rejected operations do not abort valid
        later operations; storage failure rolls back deletions, recovery payloads, events, tombstones and receipt.
        No optimistic local tombstone is safe before acceptance. Version 5 pull bootstraps recovery from cursor 0.
    SyncPullRequestV5:
      type: object
      additionalProperties: false
      required: [deviceID, protocolVersion]
      properties:
        deviceID:
          type: string
          format: uuid
        protocolVersion:
          type: integer
          enum: [5]
        cursor:
          type: integer
          minimum: 0
          default: 0
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 500
      description: >-
        Includes the v4 tree and conditional-expiry recovery data. First v5 pull after registration or an older
        pull requires cursor 0, otherwise 409. Older clients may already have discarded recovery while advancing
        their cursors. Read every page and atomically persist recovery receipts with the new baseline/cursor.
        Replaying recovery must not recreate entries previously restored, removed or cleared locally.
    SyncAutoArchiveData:
      type: object
      additionalProperties: false
      required: [archivedAt, sourceServerSeq, tab]
      properties:
        archivedAt:
          type: string
          format: date-time
          description: Server archive time in UTC with six fractional digits.
        sourceServerSeq:
          type: integer
          minimum: 1
          description: Sequence of the canonical live upsert captured before deletion.
        tab:
          type: object
          additionalProperties: true
          description: >-
            Prior canonical tab-upsert payload, including id, URL, titles, placement, rank, Space and activity.
            Historical missing pinnedFolderID is represented as null. No WebKit history, cookies or passwords.
      description: >-
        Recovery content on a tab delete event created by conditional expiry. It is immutable in event history
        and receipts. Clients must also preserve divergent local offline content before applying the deletion.
        Restore creates a fresh identity; recovery never resurrects the deleted ID.
    SyncResponseV5:
      type: object
      additionalProperties: false
      required: [protocolVersion, cursor, events]
      properties:
        protocolVersion:
          type: integer
          enum: [5]
        mutationID:
          type: string
          format: uuid
        cursor:
          type: integer
          minimum: 0
        events:
          type: array
          items:
            $ref: '#/components/schemas/SyncEventV4'
        supportedPushVersions:
          type: array
          description: Present on pull responses; v5 push is conditional expiry only.
          items:
            type: integer
            enum: [2, 3, 4, 5, 6]
          minItems: 5
          maxItems: 5
          uniqueItems: true
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/SyncOperationOutcome'
      description: >-
        V5 pulls return recovery-capable event history and supportedPushVersions. V5 push receipts additionally
        require mutationID and one outcome per expiry operation. Accepted expiry returns a canonical delete with
        autoArchive; rejection echoes current state when present and within the response limit. Complete ACK bytes
        are bounded to 4 MiB. response_limit rejects an operation without deletion or oversized canonical echo;
        preimages are never truncated. A prior tombstone remains terminal. Exact retry replays the original
        receipt after later operations or server restart. A push cursor is not a pull cursor.
    SyncBoostData:
      type: object
      additionalProperties: false
      required: [host, isEnabled, css, javaScript, zappedSelectors]
      properties:
        host:
          type: string
          minLength: 1
          maxLength: 253
          description: Lowercased host without a leading www.; the boost applies to it and its subdomains.
        isEnabled:
          type: boolean
        css:
          type: string
          maxLength: 262144
        javaScript:
          type: string
          maxLength: 262144
        zappedSelectors:
          type: array
          maxItems: 1000
          items:
            type: string
            minLength: 1
            maxLength: 4096
        title:
          type: string
          minLength: 1
          maxLength: 1024
          description: The name the user gave the boost. Absent shows the default name.
        style:
          $ref: '#/components/schemas/SyncBoostStyle'
      description: >-
        A whole site boost. Lengths count UTF-16 code units. The record identity is the operation's entityID,
        not the host: after a delete, a new boost for the same host takes a fresh identity. Optional fields are
        omitted rather than null; an upsert without them clears what an earlier write stored.
    SyncBoostStyle:
      type: object
      additionalProperties: false
      properties:
        colors:
          $ref: '#/components/schemas/SyncBoostColors'
        fontFamily:
          type: string
          minLength: 1
          maxLength: 256
          description: The family every text of the page takes.
        textCase:
          type: string
          enum: [capitalize, uppercase, lowercase]
        textZoom:
          type: number
          minimum: 0.25
          maximum: 4
          description: The page's size, 1 for the site's own.
      description: >-
        What the boost editor's controls change. An absent field keeps the site's own. Stored as one JSON
        object of at most 8 KiB.
    SyncBoostColors:
      type: object
      additionalProperties: false
      required: [invertsLightness, contrast, brightness, originalSaturation]
      properties:
        tint:
          type: object
          additionalProperties: false
          required: [hue, saturation, secondaryHueOffset]
          properties:
            hue:
              type: number
              minimum: 0
              maximum: 360
              description: Degrees around the color wheel.
            saturation:
              type: number
              minimum: 0
              maximum: 1
            secondaryHueOffset:
              type: number
              minimum: -360
              maximum: 360
              description: Degrees from the hue to the color the page's dark parts take.
        invertsLightness:
          type: boolean
        contrast:
          type: number
          minimum: 0
          maximum: 4
        brightness:
          type: number
          minimum: 0
          maximum: 4
        originalSaturation:
          type: number
          minimum: 0
          maximum: 1
          description: How much of the page's own color stays under the tint.
      description: A tint on the color wheel, turned-around lightness and the color sliders.
    SyncBoostOperation:
      type: object
      additionalProperties: false
      required: [kind, entityType, entityID]
      properties:
        kind:
          type: string
          enum: [upsert, delete]
        entityType:
          type: string
          enum: [boost]
        entityID:
          type: string
          minLength: 1
          maxLength: 200
        data:
          $ref: '#/components/schemas/SyncBoostData'
      description: >-
        Upsert (with data) replaces the whole boost; the last committed write wins. Delete (without data) leaves a
        permanent tombstone. An upsert of a tombstoned boost is rejected with reason deleted and echoes the tombstone;
        deleting it again returns deleted.
    SyncPushRequestV6:
      type: object
      additionalProperties: false
      required: [deviceID, protocolVersion, mutationID, operations]
      properties:
        deviceID:
          type: string
          format: uuid
        protocolVersion:
          type: integer
          enum: [6]
        mutationID:
          type: string
          format: uuid
        operations:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/SyncBoostOperation'
      description: >-
        Version 6 carries boost operations only; space, tab and folder intents remain v4. Negotiate
        supportedPushVersions first. Receipts, digests and outcomes follow the existing protocol.
    SyncPullRequestV6:
      type: object
      additionalProperties: false
      required: [deviceID, protocolVersion]
      properties:
        deviceID:
          type: string
          format: uuid
        protocolVersion:
          type: integer
          enum: [6]
        cursor:
          type: integer
          minimum: 0
          default: 0
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 500
      description: >-
        Everything a v5 pull returns plus boost events. Older pulls never return boost events and reset the
        device's v6 marker, so the first v6 pull after registration or an older pull requires cursor 0, otherwise 409.
    SyncResponseV6:
      type: object
      additionalProperties: false
      required: [protocolVersion, cursor, events]
      properties:
        protocolVersion:
          type: integer
          enum: [6]
        mutationID:
          type: string
          format: uuid
        cursor:
          type: integer
          minimum: 0
        events:
          type: array
          items:
            $ref: '#/components/schemas/SyncEventV4'
        supportedPushVersions:
          type: array
          description: Present on pull responses.
          items:
            type: integer
            enum: [2, 3, 4, 5, 6]
          minItems: 5
          maxItems: 5
          uniqueItems: true
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/SyncOperationOutcome'
      description: >-
        V6 pulls add boost events to the v5 history. V6 push receipts require mutationID and one outcome per boost
        operation. A push cursor is not a pull cursor.
    ReleaseAsset:
      type: object
      required: [id, name, contentType, size, downloadCount, downloadURL]
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: string
        contentType:
          type: string
        size:
          type: integer
          nullable: true
          minimum: 0
        downloadCount:
          type: integer
          nullable: true
          minimum: 0
        downloadURL:
          type: string
          format: uri
    Release:
      type: object
      required: [id, tagName, name, channel, isLatestStable, publishedAt, htmlURL, notes, assets]
      additionalProperties: false
      properties:
        id:
          type: integer
        tagName:
          type: string
        name:
          type: string
        channel:
          type: string
          enum: [stable, beta]
        isLatestStable:
          type: boolean
        publishedAt:
          type: string
          nullable: true
          format: date-time
        htmlURL:
          type: string
          format: uri
        notes:
          type: string
        assets:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseAsset"
    ReleaseIndexResponse:
      type: object
      required: [releases]
      additionalProperties: false
      properties:
        releases:
          type: array
          items:
            $ref: "#/components/schemas/Release"
