            - entityID
            - data
        - type: object
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - create
            entityType:
              type: string
              enum:
                - folder
            entityID:
              type: string
              minLength: 1
            data:
              $ref: '#/components/schemas/FolderCreateData'
            before:
              $ref: '#/components/schemas/SyncAnchorV4'
            after:
              $ref: '#/components/schemas/SyncAnchorV4'
          required:
            - kind
            - entityType
            - entityID
            - data
        - type: object
          additionalProperties: false
