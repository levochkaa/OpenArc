openapi: 3.0.3
info:
  title: TheBrowser Sync API
  version: 0.1.0
  description: Backend API for TheBrowser authentication, device registration, sync, and app updates.
servers:
  - url: https://updates.thebrowser.app
  - url: http://localhost:3000
tags:
  - name: System
  - name: Authentication
  - name: Devices
  - name: Sync
  - name: Updates
paths:
  /health:
    get:
      operationId: checkHealth
      tags: [System]
      responses:
        "200":
          description: Service health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/auth/apple:
    post:
      operationId: authenticateWithApple
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthAppleRequest"
      responses:
        "200":
          description: Sync access token and registered device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthAppleResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/devices:
    post:
      operationId: registerDevice
      tags: [Devices]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceRequest"
      responses:
        "200":
          description: Registered device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterDeviceResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/sync/push:
    post:
      operationId: pushSync
      tags: [Sync]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPushRequest"
      responses:
        "200":
          description: Sync cursor and accepted remote events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/sync/pull:
    post:
      operationId: pullSync
      tags: [Sync]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPullRequest"
      responses:
        "200":
          description: Sync cursor and remote events after the requested cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/releases:
    get:
      operationId: listReleases
      tags: [Updates]
      parameters:
        - name: channel
          in: query
          schema:
            type: string
            enum: [all, stable, beta]
            default: all
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Public release index.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseIndexResponse"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: true
      properties:
        statusCode:
          type: integer
        error:
          type: string
        message:
          type: string
    HealthResponse:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok:
          type: boolean
    Device:
      type: object
      required: [id, name, platform, lastSeenAt]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        platform:
          type: string
        publicKey:
          type: string
        lastSeenAt:
          type: string
          nullable: true
          format: date-time
    User:
      type: object
      required: [id, email]
      additionalProperties: false
      properties:
        id:
          type: string
        email:
          type: string
          nullable: true
    AuthAppleRequest:
      type: object
      required: [identityToken, deviceName, devicePlatform]
      additionalProperties: false
      properties:
        identityToken:
          type: string
          minLength: 1
        deviceName:
          type: string
          minLength: 1
          maxLength: 120
        devicePlatform:
          type: string
          minLength: 1
          maxLength: 60
    AuthAppleResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user, device]
      additionalProperties: false
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
        user:
          $ref: "#/components/schemas/User"
        device:
          $ref: "#/components/schemas/Device"
    RegisterDeviceRequest:
      type: object
      required: [name, platform]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        platform:
          type: string
          minLength: 1
          maxLength: 60
        publicKey:
          type: string
          maxLength: 4096
    RegisterDeviceResponse:
      type: object
      required: [device]
      additionalProperties: false
      properties:
        device:
          $ref: "#/components/schemas/Device"
    SpacePayload:
      type: object
      required: [title, systemImageName, rank]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
        systemImageName:
          type: string
          minLength: 1
        rank:
          type: number
        isPinnedSectionCollapsed:
          type: boolean
        selectedTabID:
          type: string
          nullable: true
    TabPayload:
      type: object
      required: [spaceID, placement, rank, urlString]
      additionalProperties: false
      properties:
        spaceID:
          type: string
          minLength: 1
        placement:
          type: string
          enum: [temporary, spacePinned, app]
        rank:
          type: number
        urlString:
          type: string
          minLength: 1
        title:
          type: string
          nullable: true
        userTitleOverride:
          type: string
          nullable: true
        faviconURLString:
          type: string
          nullable: true
        lastActivityAt:
          type: string
          nullable: true
          format: date-time
    SyncChange:
      description: >-
        Deleted entity IDs remain tombstoned. An ordinary upsert cannot restore
        them and returns the authoritative delete event. Explicit user restore
        creates a new entity ID. Push acknowledgements are not a pull cursor.
      oneOf:
        - type: object
          required: [entityType, entityID, op]
          additionalProperties: false
          properties:
            entityType:
              type: string
              enum: [space]
            entityID:
              type: string
              minLength: 1
            op:
              type: string
              enum: [upsert, delete]
            data:
              $ref: "#/components/schemas/SpacePayload"
        - type: object
          required: [entityType, entityID, op]
          additionalProperties: false
          properties:
            entityType:
              type: string
              enum: [tab]
            entityID:
              type: string
              minLength: 1
            op:
              type: string
              enum: [upsert, delete]
            data:
              $ref: "#/components/schemas/TabPayload"
    SyncPushRequest:
      type: object
      required: [deviceID, changes]
      additionalProperties: false
      properties:
        deviceID:
          type: string
        changes:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/SyncChange"
    SyncPullRequest:
      type: object
      required: [deviceID, cursor, limit]
      additionalProperties: false
      properties:
        deviceID:
          type: string
        cursor:
          type: integer
          minimum: 0
          default: 0
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 500
    SyncEvent:
      type: object
      required: [serverSeq, deviceID, entityType, entityID, op, data, createdAt]
      additionalProperties: false
      properties:
        serverSeq:
          type: integer
          minimum: 0
        deviceID:
          type: string
          nullable: true
        entityType:
          type: string
          enum: [space, tab]
        entityID:
          type: string
        op:
          type: string
          enum: [upsert, delete]
        data:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    SyncResponse:
      type: object
      required: [cursor, events]
      additionalProperties: false
      properties:
        cursor:
          type: integer
          minimum: 0
        events:
          type: array
          items:
            $ref: "#/components/schemas/SyncEvent"
    ReleaseAsset:
      type: object
      required: [id, name, contentType, size, downloadCount, downloadURL]
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: string
        contentType:
          type: string
        size:
          type: integer
          nullable: true
          minimum: 0
        downloadCount:
          type: integer
          nullable: true
          minimum: 0
        downloadURL:
          type: string
          format: uri
    Release:
      type: object
      required: [id, tagName, name, channel, isLatestStable, publishedAt, htmlURL, notes, assets]
      additionalProperties: false
      properties:
        id:
          type: integer
        tagName:
          type: string
        name:
          type: string
        channel:
          type: string
          enum: [stable, beta]
        isLatestStable:
          type: boolean
        publishedAt:
          type: string
          nullable: true
          format: date-time
        htmlURL:
          type: string
          format: uri
        notes:
          type: string
        assets:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseAsset"
    ReleaseIndexResponse:
      type: object
      required: [releases]
      additionalProperties: false
      properties:
        releases:
          type: array
          items:
            $ref: "#/components/schemas/Release"
